name: Parameterized Manual Workflow

on:
  workflow_dispatch:
    inputs:
      application_name:
        description: 'Application Name'
        required: true
        type: string
      run_validation:
        description: 'Run Validation'
        required: true
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      validation_status: ${{ steps.val_step.outputs.validation_status }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Inputs
        run: |
          echo "Application Name: ${{ inputs.application_name }}"
          echo "Run Validation: ${{ inputs.run_validation }}"

      - name: Determine Validation Result
        id: val_step
        run: |
          if [ "${{ inputs.run_validation }}" == "true" ]; then
            echo "validation_status=success" >> $GITHUB_OUTPUT
            echo "Validation passed successfully."
          else
            echo "validation_status=skipped" >> $GITHUB_OUTPUT
            echo "Validation was skipped."
          fi

  summary:
    needs: validate
    runs-on: ubuntu-latest
    if: needs.validate.outputs.validation_status == 'success'
    steps:
      - name: Execution Summary
        run: |
          echo "Workflow executed successfully for application: ${{ inputs.application_name }}"
          echo "Validation was successful!"
